<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBD 商城后台管理系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #8051E6;
  --primary-light: #a78bfa;
  --primary-dark: #6d3fd4;
  --text-primary: #303133;
  --text-regular: #606266;
  --text-secondary: #909399;
  --text-placeholder: #c0c4cc;
  --border-color: #ebeef5;
  --border-light: #f2f6fc;
  --bg-page: #f5f7fa;
  --bg-white: #ffffff;
  --table-header-bg: #f5f7fa;
  --danger: #f56c6c;
  --success: #67c23a;
  --warning: #e6a23c;
  --info: #909399;
}
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 14px; color: var(--text-regular); background: var(--bg-page); }
ul, li { list-style: none; }
a { text-decoration: none; color: inherit; }
button { cursor: pointer; border: none; outline: none; font-size: 14px; }
input, select, textarea { font-size: 14px; }

/* Layout */
.layout { display: flex; min-height: 100vh; }
.sidebar { width: 270px; background: var(--bg-white); display: flex; border-right: 1px solid var(--border-color); position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; transition: width 0.2s; }
.main-sidebar { width: 100px; background: var(--bg-white); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding-top: 12px; overflow-y: auto; }
.main-sidebar::-webkit-scrollbar { display: none; }
.main-sidebar .logo { margin-bottom: 16px; }
.main-menu-item { width: 84px; padding: 10px 4px; margin: 2px 4px; display: flex; flex-direction: column; align-items: center; cursor: pointer; border-radius: 8px; transition: all 0.2s; }
.main-menu-item:hover { background: #f5f3ff; }
.main-menu-item.active { background: #f5f3ff; }
.main-menu-item .menu-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
.main-menu-item .menu-icon svg { width: 18px; height: 18px; }
.main-menu-item .menu-label { font-size: 12px; color: var(--text-primary); text-align: center; line-height: 1.2; }
.main-menu-item.active .menu-label { color: var(--primary); font-weight: 500; }
.main-menu-item.active .menu-icon svg { stroke: var(--primary); }
.main-menu-item.active .menu-icon svg path { stroke: var(--primary); }

/* Sub Sidebar */
.sub-sidebar { width: 170px; background: var(--bg-white); overflow-y: auto; padding-top: 8px; }
.sub-sidebar::-webkit-scrollbar { width: 4px; }
.sub-sidebar::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
.sub-sidebar-title { height: 42px; padding-left: 18px; display: flex; align-items: center; font-size: 16px; font-weight: 600; color: var(--text-primary); }
.sub-menu-item { padding: 9px 18px 9px 28px; font-size: 13px; color: var(--text-regular); cursor: pointer; transition: all 0.15s; position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub-menu-item:hover { color: var(--primary); background: #faf8ff; }
.sub-menu-item.active { color: var(--primary); font-weight: 500; background: #f5f3ff; }
.sub-menu-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 16px; background: var(--primary); border-radius: 0 2px 2px 0; }

/* Sub menu group */
.sub-menu-group { margin-bottom: 4px; }
.sub-menu-group-title { padding: 10px 18px; font-size: 14px; color: var(--text-primary); font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: color 0.2s; }
.sub-menu-group-title:hover { color: var(--primary); }
.sub-menu-group-title .arrow { font-size: 10px; transition: transform 0.2s; color: var(--text-secondary); }
.sub-menu-group.open .sub-menu-group-title .arrow { transform: rotate(180deg); }
.sub-menu-children { display: none; }
.sub-menu-group.open .sub-menu-children { display: block; }

/* Content */
.content-area { margin-left: 270px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; transition: margin-left 0.2s; }
.top-bar { height: 56px; background: var(--bg-white); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: sticky; top: 0; z-index: 50; }
.breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text-secondary); }
.breadcrumb .current { color: var(--text-primary); font-weight: 500; }
.breadcrumb .sep { color: var(--text-placeholder); }
.search-trigger { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--text-secondary); background: var(--bg-white); transition: border-color 0.2s; }
.search-trigger:hover { border-color: var(--primary-light); }
.search-trigger .shortcut { background: var(--bg-page); padding: 1px 5px; border-radius: 3px; font-size: 11px; color: var(--text-secondary); }
.top-right { display: flex; align-items: center; gap: 16px; }
.user-info { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.user-info .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--primary-light); display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; }
.page-content { flex: 1; padding: 16px; }

/* Components */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 8px 16px; border-radius: 4px; font-size: 14px; transition: all 0.2s; white-space: nowrap; }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-default { background: var(--bg-white); color: var(--text-regular); border: 1px solid var(--border-color); }
.btn-default:hover { color: var(--primary); border-color: var(--primary-light); }
.btn-text { background: none; color: var(--primary); padding: 4px 8px; }
.btn-text:hover { color: var(--primary-dark); }
.btn-danger-text { background: none; color: var(--danger); padding: 4px 8px; }
.btn-sm { font-size: 12px; padding: 4px 8px; }
.btn-text.btn-sm { font-size: 12px; }

/* Filter Bar */
.filter-bar { background: var(--bg-white); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
.filter-row { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; }
.filter-item { display: flex; align-items: center; gap: 6px; }
.filter-item label { font-size: 13px; color: var(--text-regular); white-space: nowrap; }
.filter-item input, .filter-item select { padding: 6px 12px; border: 1px solid var(--border-color); border-radius: 4px; outline: none; font-size: 13px; min-width: 160px; transition: border-color 0.2s; }
.filter-item input:focus, .filter-item select:focus { border-color: var(--primary); }
.filter-actions { display: flex; gap: 8px; margin-left: auto; }

/* Action Bar */
.action-bar { background: var(--bg-white); border-radius: 8px; padding: 12px 20px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
.action-bar-left { display: flex; gap: 8px; flex-wrap: wrap; }

/* Table */
.table-wrapper { background: var(--bg-white); border-radius: 8px; overflow: hidden; }
.table-wrapper table { width: 100%; border-collapse: collapse; }
.table-wrapper th { background: var(--table-header-bg); font-weight: 500; font-size: 13px; color: var(--text-primary); padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
.table-wrapper td { padding: 12px 16px; font-size: 13px; color: var(--text-regular); border-bottom: 1px solid var(--border-light); }
.table-wrapper tr:hover td { background: #faf8ff; }
.checkbox { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }

/* Tags */
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
.tag-primary { background: #f0eaff; color: var(--primary); border: 1px solid #e0d4ff; }
.tag-success { background: #f0f9eb; color: var(--success); border: 1px solid #e1f3d8; }
.tag-warning { background: #fdf6ec; color: var(--warning); border: 1px solid #faecd8; }
.tag-danger { background: #fef0f0; color: var(--danger); border: 1px solid #fde2e2; }
.tag-info { background: #f4f4f5; color: var(--info); border: 1px solid #e9e9eb; }

/* Pagination */
.pagination { display: flex; align-items: center; justify-content: flex-end; padding: 16px 20px; gap: 4px; }
.page-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-white); color: var(--text-regular); cursor: pointer; font-size: 13px; }
.page-btn:hover { color: var(--primary); border-color: var(--primary-light); }
.page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
.page-btn:disabled { color: var(--text-placeholder); cursor: not-allowed; background: var(--bg-white); }

/* Tab Bar */
.tab-bar { display: flex; border-bottom: 1px solid var(--border-color); background: var(--bg-white); border-radius: 8px 8px 0 0; padding: 0 16px; gap: 0; }
.tab-item { padding: 12px 16px; font-size: 14px; color: var(--text-regular); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
.tab-item:hover { color: var(--primary); }
.tab-item.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 500; }

/* Form */
.form-card { background: var(--bg-white); border-radius: 8px; padding: 24px; }
.form-row { display: flex; gap: 24px; margin-bottom: 20px; flex-wrap: wrap; }
.form-group { display: flex; flex-direction: column; gap: 6px; min-width: 200px; }
.form-label { font-size: 13px; color: var(--text-regular); font-weight: 500; }
.form-label.required::before { content: '*'; color: var(--danger); margin-right: 4px; }
.form-control input, .form-control select, .form-control textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 13px; outline: none; transition: border-color 0.2s; }
.form-control input:focus, .form-control select:focus, .form-control textarea:focus { border-color: var(--primary); }

/* Switch */
.switch { position: relative; display: inline-block; width: 40px; height: 22px; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #ccc; border-radius: 22px; transition: 0.3s; }
.switch .slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 2px; bottom: 2px; background: white; border-radius: 50%; transition: 0.3s; }
.switch input:checked + .slider { background: var(--primary); }
.switch input:checked + .slider::before { transform: translateX(18px); }

/* Alert */
.alert { padding: 10px 16px; border-radius: 4px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; font-size: 13px; }
.alert-warning { background: #fdf6ec; color: var(--warning); border: 1px solid #faecd8; }
.alert-info { background: #ecf5ff; color: #409eff; border: 1px solid #d9ecff; }

/* Upload area */
.upload-area { border: 2px dashed var(--border-color); border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; transition: border-color 0.2s; }
.upload-area:hover { border-color: var(--primary-light); }
.upload-area .upload-icon { font-size: 32px; color: var(--text-placeholder); margin-bottom: 8px; }
.upload-area .upload-text { font-size: 14px; color: var(--text-secondary); }

/* Image grid */
.image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-top: 16px; }
.image-item { border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; cursor: pointer; transition: border-color 0.2s; position: relative; }
.image-item:hover { border-color: var(--primary-light); }
.image-item .img-wrap { width: 100%; height: 100px; background: var(--bg-page); display: flex; align-items: center; justify-content: center; font-size: 32px; color: var(--text-placeholder); }
.image-item .img-name { padding: 6px 8px; font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Section title */
.section-title { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }

/* Search Modal */
.search-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: flex-start; justify-content: center; padding-top: 15vh; }
.search-overlay.active { display: flex; }
.search-box { background: var(--bg-white); border-radius: 12px; width: 540px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); overflow: hidden; }
.search-input-wrap { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border-color); }
.search-input-wrap input { flex: 1; border: none; outline: none; font-size: 16px; padding: 4px 8px; }
.search-input-wrap .search-icon { color: var(--text-secondary); font-size: 18px; }
.search-results { max-height: 400px; overflow-y: auto; padding: 8px 0; }
.search-result-item { padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background 0.15s; }
.search-result-item:hover { background: #f5f3ff; }
.search-result-item .result-label { font-size: 14px; color: var(--text-primary); }
.search-result-item .result-path { font-size: 12px; color: var(--text-secondary); margin-left: auto; }

/* Chart placeholder */
.chart-area { background: var(--bg-white); border-radius: 8px; padding: 24px; margin-bottom: 16px; min-height: 300px; display: flex; align-items: center; justify-content: center; color: var(--text-placeholder); font-size: 14px; border: 1px solid var(--border-color); }

/* Info tip */
.info-tip { background: #ecf5ff; border-radius: 4px; padding: 8px 12px; margin-bottom: 16px; font-size: 13px; color: #409eff; display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="main-sidebar">
      <div class="logo">
        <svg viewBox="0 0 50 38" width="50" height="38"><rect rx="6" width="50" height="38" fill="#8051E6"/><text x="25" y="25" text-anchor="middle" fill="white" font-size="12" font-weight="bold">CBD</text></svg>
      </div>
      <ul class="main-menu-list" id="mainMenu"></ul>
    </div>
    <div class="sub-sidebar" id="subSidebar"></div>
  </aside>

  <div class="content-area">
    <header class="top-bar">
      <div class="breadcrumb">
        <span id="currentMain">商品</span>
        <span class="sep">/</span>
        <span id="currentPage">商品管理</span>
      </div>
      <div class="top-right">
        <button class="search-trigger" onclick="openSearch()">
          🔍 搜索
          <span class="shortcut">⌘K</span>
        </button>
        <span style="color:var(--border-color);">|</span>
        <div class="user-info">
          <div class="avatar">王</div>
          <span style="font-size:13px;">王</span>
        </div>
        <span style="color:var(--border-color);">|</span>
        <span style="font-size:13px;color:var(--text-secondary);cursor:pointer;">系统信息</span>
      </div>
    </header>
    <main class="page-content" id="pageContent"></main>
  </div>
</div>

<!-- Search Modal -->
<div class="search-overlay" id="searchOverlay" onclick="closeSearch(event)">
  <div class="search-box" onclick="event.stopPropagation()">
    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索页面..." oninput="handleSearch(this.value)">
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<script>
// ============ MENU DATA ============
const menuData = [
  {
    id: 'products', label: '商品', icon: 'products',
    children: [
      { group: '商品', items: ['商品管理', '添加商品', '商品品牌', '店铺分类', '商品标签', '素材管理'] }
    ]
  },
  {
    id: 'trade', label: '交易', icon: 'trade',
    children: [
      { group: '交易', items: ['全部订单', '交易单', '售后列表', '退款单', '运费模板', '配送管理'] }
    ]
  },
  {
    id: 'member', label: '会员', icon: 'member',
    children: [
      { group: '会员管理', items: ['会员列表'] }
    ]
  },
  {
    id: 'shop', label: '店铺', icon: 'shop',
    children: [
      { group: '店铺', items: ['店铺信息'] }
    ]
  },
  {
    id: 'marketing', label: '营销', icon: 'marketing',
    children: [
      { group: '优惠券', items: ['优惠券管理', '发券记录'] },
      { group: '促销', items: ['加价购', '组合购', '限时优惠', '商品限购', '满折', '满减', '满赠'] }
    ]
  },
  {
    id: 'report', label: '报表', icon: 'report',
    children: [
      { group: '报表', items: ['店铺统计'] },
      { group: '结算', items: ['结算汇总'] }
    ]
  },
  {
    id: 'settings', label: '设置', icon: 'settings',
    children: [
      { group: '账号管理', items: ['店铺管理员', '店铺角色', '配送员'] },
      { group: '设置', items: ['导出列表', '脱敏数据'] }
    ]
  }
];

// Icon SVGs
const iconSvgs = {
  products: '<svg viewBox="0 0 48 48" fill="none"><path d="M9.78 9.75C9.91 8.75 10.76 8 11.77 8H36.23C37.24 8 38.09 8.75 38.22 9.75L41.72 37.75C41.87 38.95 40.94 40 39.73 40H8.27C7.06 40 6.13 38.95 6.28 37.75L9.78 9.75Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M15 18C15 18 17 22 24 22C31 22 33 18 33 18" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>',
  trade: '<svg viewBox="0 0 48 48" fill="none"><path d="M33 7H38C39.1 7 40 7.9 40 9V42C40 43.1 39.1 44 38 44H10C8.9 44 8 43.1 8 42V9C8 7.9 8.9 7 10 7H16H17V10H31V7H33Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><rect x="17" y="4" width="14" height="6" stroke="currentColor" stroke-width="4"/><path d="M27 19L19 27H29L21 35" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>',
  member: '<svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="18" r="8" stroke="currentColor" stroke-width="4"/><path d="M6 40C6 32 14 28 24 28C34 28 42 32 42 40" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>',
  shop: '<svg viewBox="0 0 48 48" fill="none"><path d="M4 18H44V40C44 41.1 43.1 42 42 42H6C4.9 42 4 41.1 4 40V18Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M4 18L8 8H40L44 18" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M18 18V42" stroke="currentColor" stroke-width="4"/><path d="M30 18V42" stroke="currentColor" stroke-width="4"/></svg>',
  marketing: '<svg viewBox="0 0 48 48" fill="none"><path d="M6 12L20 6V42L6 36V12Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M20 6L34 12V36L20 42" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M34 12L42 8V32L34 36" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg>',
  report: '<svg viewBox="0 0 48 48" fill="none"><rect x="6" y="6" width="36" height="36" rx="3" stroke="currentColor" stroke-width="4"/><path d="M14 28V20" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M22 28V14" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M30 28V22" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>',
  settings: '<svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="8" stroke="currentColor" stroke-width="4"/><path d="M24 4V10" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M24 38V44" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M4 24H10" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M38 24H44" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M9.86 9.86L14.1 14.1" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M33.9 33.9L38.14 38.14" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M38.14 9.86L33.9 14.1" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M14.1 33.9L9.86 38.14" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>'
};

// ============ STATE ============
let currentMain = 'products';
let currentSub = '';

// ============ RENDER ============
function renderMainMenu() {
  const ul = document.getElementById('mainMenu');
  ul.innerHTML = menuData.map(m => `
    <li class="main-menu-item ${m.id === currentMain ? 'active' : ''}" data-id="${m.id}" onclick="selectMain('${m.id}')">
      <span class="menu-icon">${iconSvgs[m.icon] || iconSvgs.products}</span>
      <span class="menu-label">${m.label}</span>
    </li>
  `).join('');
}

function renderSubMenu() {
  const menu = menuData.find(m => m.id === currentMain);
  const sub = document.getElementById('subSidebar');
  const sidebar = document.querySelector('.sidebar');
  const contentArea = document.querySelector('.content-area');
  if (!menu || !menu.children.length) {
    sub.innerHTML = '';
    sub.style.display = 'none';
    sidebar.style.width = '100px';
    contentArea.style.marginLeft = '100px';
    return;
  }
  sub.style.display = '';
  sidebar.style.width = '270px';
  contentArea.style.marginLeft = '270px';
  let html = `<div class="sub-sidebar-title">${menu.label}</div>`;
  menu.children.forEach((group, gi) => {
    const isOpen = true;
    html += `<div class="sub-menu-group ${isOpen ? 'open' : ''}">
      <div class="sub-menu-group-title" onclick="toggleGroup(this)">
        ${group.group}
        <span class="arrow">▼</span>
      </div>
      <div class="sub-menu-children">`;
    group.items.forEach(item => {
      const pageId = `${currentMain}-${gi}-${item}`;
      const isActive = currentSub === pageId;
      html += `<div class="sub-menu-item ${isActive ? 'active' : ''}" onclick="selectSub('${pageId}', '${menu.label}', '${group.group}', '${item}')">${item}</div>`;
    });
    html += `</div></div>`;
  });
  sub.innerHTML = html;
}

  const content = document.getElementById('pageContent');

  document.getElementById('currentPage').textContent = itemLabel || mainLabel;

}

// ============ INTERACTIONS ============
function selectMain(id) {
  currentMain = id;
  currentSub = '';
  renderMainMenu();
  renderSubMenu();
  const menu = menuData.find(m => m.id === id);
  if (menu && menu.children.length) {
    const firstGroup = menu.children[0];
    const firstItem = firstGroup.items[0];
    currentSub = `${id}-0-${firstItem}`;
    renderSubMenu();
    renderPage(menu.label, firstGroup.group, firstItem);
  }
}

function selectSub(pageId, mainLabel, groupLabel, itemLabel) {
  currentSub = pageId;
  renderSubMenu();
  renderPage(mainLabel, groupLabel, itemLabel);
}

function toggleGroup(el) {
  el.parentElement.classList.toggle('open');
}

// ============ SEARCH ============
function openSearch() {
  document.getElementById('searchOverlay').classList.add('active');
  document.getElementById('searchInput').focus();
}

function closeSearch(e) {
  if (e && e.target !== document.getElementById('searchOverlay')) return;
  document.getElementById('searchOverlay').classList.remove('active');
}

function handleSearch(query) {
  const results = document.getElementById('searchResults');
  if (!query) { results.innerHTML = ''; return; }
  let items = [];
  menuData.forEach(m => {
    m.children.forEach(g => {
      g.items.forEach(item => {
        if (item.includes(query)) items.push({ main: m.label, item });
      });
    });
  });
  results.innerHTML = items.length ? items.map(i => `
    <div class="search-result-item" onclick="document.getElementById('searchOverlay').classList.remove('active');">
      <span class="result-label">${i.item}</span>
      <span class="result-path">${i.main}</span>
    </div>
  `).join('') : '<div style="padding:20px;text-align:center;color:var(--text-secondary);">无匹配结果</div>';
}

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openSearch(); }
  if (e.key === 'Escape') { document.getElementById('searchOverlay').classList.remove('active'); }
});

// ============ INIT ============
renderMainMenu();
renderSubMenu();
const firstMenu = menuData[0];
const firstGroup = firstMenu.children[0];
const firstItem = firstGroup.items[0];
currentSub = `${firstMenu.id}-0-${firstItem}`;
renderSubMenu();
renderPage(firstMenu.label, firstGroup.group, firstItem);
</script>
